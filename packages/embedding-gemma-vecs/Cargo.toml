[package]
name = "embedding-gemma-vecs"
version = "0.1.0"
edition = "2021"
description = "High-throughput Actix Web vector search engine powered by USearch, SQLite, and EmbeddingGemma 2"
license = "Apache-2.0"

[dependencies]
actix-web = "4"
actix-multipart = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
thiserror = "1.0"
async-trait = "0.1"
parking_lot = "0.12"
usearch = "2.26"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
