name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality Gate: Linting, Typecheck & Monorepo Audit
  quality:
    name: Quality Gate & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Validate Conventional Commits
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Monorepo Typecheck (Turborepo)
        run: pnpm run check-types

      - name: Audit Dependencies for Critical CVEs
        run: pnpm audit --audit-level=critical

  # Linux Native Desktop Shell Verification (Tauri + Rust)
  desktop-linux:
    name: Linux Desktop (Tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-env

      - name: Setup Tauri Linux Toolchain
        uses: ./.github/actions/setup-tauri

      - name: Build Desktop Web Assets (Vite + Tailwind)
        run: pnpm --filter @cobot/desktop build

      - name: Cargo Check (Native Rust Shell)
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Cargo Clippy Linter
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

  # Backend Agent Daemon Verification
  agent-daemon:
    name: Backend Agent Daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-env

      - name: Check Daemon Types & Compilation
        run: pnpm --filter @cobot/agent-daemon check-types
