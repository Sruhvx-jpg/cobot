name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality Gate: Linting, Typecheck & Monorepo Audit
  quality:
    name: Quality Gate & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Setup Go Environment
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.24"

      - name: Validate Conventional Commits
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Monorepo Typecheck (Turborepo)
        run: pnpm run check-types

      - name: Verify Tool and Prompt Synchronization
        run: ./scripts/checks/check-tool-prompt-sync.sh

      - name: Audit Dependencies for Critical CVEs
        run: pnpm audit --audit-level=critical

  # Linux Native Desktop Shell Verification (Tauri + Rust)
  desktop-linux:
    name: Linux Desktop (Tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-env

      - name: Setup Tauri Linux Toolchain
        uses: ./.github/actions/setup-tauri

      - name: Build Desktop Web Assets (Vite + Tailwind)
        run: pnpm --filter @cobot/desktop build

      - name: Cargo Check (Native Rust Shell)
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Cargo Clippy Linter
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

  # Backend Agent Daemon Verification
  agent-daemon:
    name: Backend Agent Daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-env

      - name: Check Daemon Types & Compilation
        run: pnpm --filter @cobot/agent-daemon check-types

  # Go Microservices Verification (TracerDuty & AgentHouse)
  go-microservices:
    name: Go Microservices (Build, Race, Lint & Vuln)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.24"

      - name: Verify Code Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l apps/tracer-duty/src apps/sabha/src || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted files: $UNFORMATTED"
            exit 1
          fi

      - name: Go Vet Compiler Checks
        run: go vet ./apps/tracer-duty/src/... ./apps/sabha/src/...

      - name: Build TracerDuty Microservice
        run: cd apps/tracer-duty/src && go build -v ./...

      - name: Build AgentHouse Microservice
        run: cd apps/sabha/src && go build -v ./...

      - name: Run Tests with Race Detector
        run: |
          cd apps/tracer-duty/src && go test -race -v ./... || true
          cd ../../sabha/src && go test -race -v ./... || true

      - name: Test Chai Engine (Core SQL)
        run: cd packages/chai-engine && go test -v .

      - name: Official golangci-lint Action
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          args: ./apps/tracer-duty/src/... ./apps/sabha/src/...

      - name: Run govulncheck on TracerDuty
        uses: golang/govulncheck-action@v1
        with:
          work-dir: apps/tracer-duty/src

      - name: Run govulncheck on AgentHouse
        uses: golang/govulncheck-action@v1
        with:
          work-dir: apps/sabha/src

  # VecS Vector Engine & EmbeddingGemma Verification (Rust Core)
  vecs-engine:
    name: VecS Vector Engine (Rust)
    runs-on: ubuntu-latest
    env:
      RUST_MIN_STACK_SIZE: 8388608
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Check (EmbeddingGemma-VecS Package)
        run: cargo check --manifest-path packages/embedding-gemma-vecs/Cargo.toml

      - name: Run EmbeddingGemma-VecS Unit Tests
        run: cargo test --manifest-path packages/embedding-gemma-vecs/Cargo.toml

      - name: Cargo Check (VecS Daemon App)
        run: cargo check --manifest-path apps/vecs/Cargo.toml

